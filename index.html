<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E30Heaven Configurator V4</title>
<style>
:root{--bg:#080a0d;--panel:#101419;--panel2:#151a20;--line:#2a3038;--text:#f4f5f6;--muted:#9ba3ad;--accent:#d9d9d9;--good:#a8ffbf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#252b33 0,#0b0e12 42%,#07090b 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:1440px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.logo{font-weight:900;letter-spacing:-1px;font-size:25px}.logo span{font-weight:500;color:#aab0b8}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#171c22;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.btn:hover{background:#20262d}.btn.primary{background:#f2f2f2;color:#080a0d;border-color:#f2f2f2}.layout{display:grid;grid-template-columns:1fr 430px;gap:16px}.preview{position:sticky;top:16px;align-self:start;background:linear-gradient(145deg,#151a20,#090b0e);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #0008}.stage{height:650px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 62%,#30353c 0,#171b20 32%,#0b0d10 70%)}.stage:after{content:"";position:absolute;left:8%;right:8%;bottom:11%;height:9%;background:#0009;border-radius:50%;filter:blur(18px)}#car{width:94%;height:94%;position:relative;z-index:2;transition:transform .35s ease,opacity .2s}.viewbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.viewbar button{flex:1}.viewbar .active{background:#f2f2f2;color:#080a0d;border-color:#f2f2f2}.caption{display:flex;justify-content:space-between;padding:0 14px 14px;color:var(--muted);font-size:12px}.controls{background:#0e1217;border:1px solid var(--line);border-radius:18px;padding:16px}.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:14px}.step{border:1px solid var(--line);background:#12171c;color:var(--muted);border-radius:8px;padding:9px 3px;font-size:10px;font-weight:800;cursor:pointer;text-align:center}.step.active{color:#0a0c0e;background:#eee;border-color:#eee}.section{display:none}.section.active{display:block}.eyebrow{font-size:11px;color:#8e97a2;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{font-size:24px;font-weight:900;margin:5px 0 4px}.sub{font-size:13px;color:var(--muted);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:1px solid var(--line);background:#14191f;border-radius:12px;padding:12px;cursor:pointer;min-height:74px}.choice:hover{border-color:#707983}.choice.selected{border-color:#f2f2f2;background:#e9e9e9;color:#0b0d0f}.choice strong{display:block;font-size:14px}.choice small{display:block;color:var(--muted);margin-top:5px}.choice.selected small{color:#525961}.swatch{height:50px;border-radius:9px;border:1px solid #ffffff22;margin-bottom:8px}.wheel-icon{height:54px;display:grid;place-items:center;margin-bottom:6px}.wheel-icon svg{width:52px;height:52px}.nav{display:flex;gap:9px;margin-top:16px}.nav .btn{flex:1}.summary{display:grid;gap:9px}.summary-row{display:flex;justify-content:space-between;gap:10px;padding:10px 11px;background:#14191f;border:1px solid var(--line);border-radius:10px;font-size:13px}.summary-row span:first-child{color:var(--muted)}.price{font-size:27px;font-weight:900;margin-top:10px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.spec{background:#14191f;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}.spec b{display:block;font-size:16px}.spec span{font-size:10px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#f2f2f2;color:#090b0d;padding:11px 15px;border-radius:10px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:950px){.layout{grid-template-columns:1fr}.preview{position:relative;top:auto}.stage{height:430px}.steps{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.app{padding:10px}.top{align-items:flex-start}.actions .btn{padding:8px}.stage{height:330px}.grid{grid-template-columns:1fr}.controls{padding:12px}.title{font-size:21px}}
</style></head>
<body><div class="app">
<header class="top"><div class="logo">E30<span>Heaven</span> <small style="font-size:10px;color:#737b85">CONFIGURATOR V4</small></div><div class="actions"><button class="btn" onclick="saveBuild()">SAVE</button><button class="btn" onclick="loadBuild()">LOAD</button><button class="btn primary" onclick="shareBuild()">SHARE</button></div></header>
<div class="layout">
<section class="preview"><div class="stage"><div id="car"></div></div><div class="viewbar"><button class="btn active" data-view="three" onclick="setView('three')">3/4 FRONT</button><button class="btn" data-view="side" onclick="setView('side')">SIDE</button><button class="btn" data-view="rear" onclick="setView('rear')">3/4 REAR</button></div><div class="caption"><span id="caption">1989 E30 325i Touring</span><span id="angle">Front 3/4</span></div></section>
<section class="controls"><div class="steps" id="steps"></div><div id="sections"></div></section></div></div><div class="toast" id="toast"></div>
<script>
const data={
 model:[['1984–87','Early E30','1984–87'],['1988–91','Late E30','1988–91'],['1990–94','M3','M3'],['1988–93','iX','iX']],
 body:[['Coupe','2-door Coupe',''],['Touring','Touring',''],['Cabrio','Cabrio',''],['M3','M3 Widebody','M3']],
 engine:[['316i','316i','90 hp'],['318i','318i','105 hp'],['320i','320i','129 hp'],['323i','323i','150 hp'],['325i','325i','171 hp'],['325iX','325iX','171 hp'],['S54','S54 Swap','343 hp'],['M20 Stroker','M20 Stroker','220 hp']],
 color:[['Alpine White','Alpine White','#f0f0ec'],['Diamant Black','Diamant Black','#17191b'],['Delphin Grey','Delphin Grey','#596068'],['Lachssilber','Lachssilber','#aeb3b5'],['Zinnober Red','Zinnober Red','#9d1f20'],['Brilliant Red','Brilliant Red','#bd2625'],['Techno Violet','Techno Violet','#34215a'],['Laguna Seca Blue','Laguna Seca Blue','#1e4e91'],['Riviera Blue','Riviera Blue','#2c77a8'],['Blood Orange','Blood Orange','#c95525']],
 wheels:[['BBS RS','BBS RS','bbs'],['Rondell 58','Rondell 58','rondell'],['Style 5','BMW Style 5','style5'],['AC Schnitzer','AC Schnitzer Type 2','acs'],['M3 EVO','M3 EVO','evo'],['OEM 15','OEM 15-inch','oem']],
 interior:[['Black','Black leather',''],['Natur','Natur leather',''],['Sport Cloth','Sport cloth',''],['M-Tech','M-Tech interior',''],['Tan','Tan leather','']]
};
const steps=[['model','MODEL'],['body','BODY'],['engine','ENGINE'],['color','COLOR'],['wheels','WHEELS'],['interior','INTERIOR'],['summary','BUILD']];
let state={model:1,body:1,engine:4,color:0,wheels:0,interior:0,view:'three'};let current=0;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function selected(k){return data[k][state[k]]}
function money(){const base={model:[0,0,2500,4500],body:[0,9000,12000,28000],engine:[0,1500,3500,7000,10000,12000,28000,16000],color:[0,400,900,700,1200,1500,1800,1800,1800,1600],wheels:[1400,1800,1600,2200,2600,700],interior:[0,900,1200,1800,1400]};return 0+base.model[state.model]+base.body[state.body]+base.engine[state.engine]+base.color[state.color]+base.wheels[state.wheels]+base.interior[state.interior]}
function init(){document.getElementById('steps').innerHTML=steps.map((s,i)=>`<button class="step ${i===0?'active':''}" onclick="go(${i})">${s[1]}</button>`).join('');document.getElementById('sections').innerHTML=steps.map((s,i)=>`<div class="section ${i===0?'active':''}" id="sec-${s[0]}"></div>`).join('');renderAll();setView('three');loadFromHash()}
function renderAll(){for(const [k,label] of steps){if(k==='summary')renderSummary();else renderChoices(k,label)}updatePreview()}
function renderChoices(k,label){const sec=document.getElementById('sec-'+k);sec.innerHTML=`<div class="eyebrow">E30Heaven</div><div class="title">Choose ${label.toLowerCase()}</div><div class="sub">Your choice updates the car preview instantly.</div><div class="grid">${data[k].map((x,i)=>choiceHTML(k,x,i)).join('')}</div><div class="nav"><button class="btn" onclick="prev()">BACK</button><button class="btn primary" onclick="next()">NEXT</button></div>`}
function choiceHTML(k,x,i){let visual='';if(k==='color')visual=`<div class="swatch" style="background:${x[2]}"></div>`;if(k==='wheels')visual=`<div class="wheel-icon">${wheelSVG(x[2],false)}</div>`;return `<div class="choice ${state[k]===i?'selected':''}" onclick="choose('${k}',${i})">${visual}<strong>${esc(x[0])}</strong><small>${esc(x[1]||x[2]||'')}</small></div>`}
function choose(k,i){state[k]=i;renderAll();toast('Updated '+k);}
function go(i){current=Math.max(0,Math.min(6,i));document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('active',j===current));document.querySelectorAll('.section').forEach((s,j)=>s.classList.toggle('active',j===current));window.scrollTo({top:0,behavior:'smooth'})}
function next(){go(current<6?current+1:6)}function prev(){go(current>0?current-1:0)}
function setView(v){state.view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('angle').textContent=v==='three'?'Front 3/4':v==='side'?'Side profile':'Rear 3/4';updatePreview()}
function wheelSVG(type,large=true){const scale=large?'1':'0.82';const spokes={bbs:16,rondell:8,style5:5,acs:10,evo:5,oem:6}[type]||8;let lines='';for(let i=0;i<spokes;i++){const a=i*360/spokes,rad=a*Math.PI/180;lines+=`<line x1="50" y1="17" x2="${50+31*Math.sin(rad)}" y2="${50-31*Math.cos(rad)}" stroke="#b9bec4" stroke-width="${type==='bbs'?2:5}"/>`}return `<svg viewBox="0 0 100 100" style="transform:scale(${scale})"><circle cx="50" cy="50" r="43" fill="#0a0b0d" stroke="#8c939a" stroke-width="3"/><circle cx="50" cy="50" r="33" fill="#1a1d21"/>${lines}<circle cx="50" cy="50" r="9" fill="#8d949a"/><circle cx="50" cy="50" r="4" fill="#111"/></svg>`}
function carSVG(){const body=selected('body')[0], col=selected('color')[2], model=selected('model')[0], eng=selected('engine')[0], wheel=selected('wheels')[2];let touring=body==='Touring',cab=body==='Cabrio',m3=body==='M3'||model==='M3';const side=state.view==='side',rear=state.view==='rear';let wheel1=side?32:27,wheel2=side?68:70;let bodyPath,glassPath,roofPath;if(side){bodyPath=touring?'M14 66 L16 48 Q18 43 28 41 L36 27 Q41 20 54 20 L72 22 Q78 26 83 40 L91 45 L93 62 Q92 70 82 71 L18 71 Z':cab?'M14 65 L17 48 Q20 43 33 41 L40 28 Q48 23 65 25 L76 29 L84 42 L92 47 L93 64 Q90 70 82 71 L18 71 Z':'M14 65 L17 48 Q20 43 31 41 L39 25 Q44 19 58 19 L72 22 Q78 27 83 41 L91 46 L93 64 Q90 70 82 71 L18 71 Z';glassPath=cab?'M39 41 L43 29 Q49 26 64 28 L74 32 L79 41 Z':'M38 40 L43 25 Q48 22 58 22 L70 25 Q75 28 80 40 Z';roofPath='';}else{bodyPath=rear?'M18 66 Q18 55 25 47 L34 35 Q42 28 59 28 L75 34 L85 47 Q91 54 92 66 L86 72 L23 72 Z':'M17 66 Q18 53 28 45 L38 31 Q46 23 62 25 L76 32 L85 45 Q91 53 92 66 L86 72 L23 72 Z';glassPath=rear?'M35 45 L40 34 Q48 30 59 31 L70 36 L76 45 Z':'M35 43 L42 29 Q49 25 61 27 L72 33 L79 43 Z';roofPath=''}
if(m3&&side) bodyPath=bodyPath.replace('Q20 43','Q18 43');
let wheels=`<g transform="translate(${wheel1} 65) scale(.105)">${wheelSVG(wheel,false).replace('<svg','<g').replace('</svg>','</g>')}</g><g transform="translate(${wheel2} 65) scale(.105)">${wheelSVG(wheel,false).replace('<svg','<g').replace('</svg>','</g>')}</g>`;
let bumper=rear?`<rect x="15" y="61" width="80" height="6" rx="2" fill="#202428"/>`:`<rect x="13" y="61" width="14" height="5" rx="2" fill="#202428"/><rect x="86" y="61" width="10" height="5" rx="2" fill="#202428"/>`;
let badges=`<text x="77" y="55" font-size="4" font-weight="800" fill="#ddd">${esc(eng)}</text>`;
let m3f=m3?`<path d="M13 52 Q20 43 30 43" fill="none" stroke="#111" stroke-width="3"/><path d="M82 43 Q90 44 96 52" fill="none" stroke="#111" stroke-width="3"/>`:'';
let shadow=`<ellipse cx="53" cy="75" rx="42" ry="5" fill="#0008"/>`;
let cabin=cab?`<path d="${glassPath}" fill="#171c22" stroke="#0b0d10" stroke-width="1"/>`:`<path d="${glassPath}" fill="#18232d" stroke="#0b0d10" stroke-width="1"/><path d="M56 25 L56 41" stroke="#0b0d10" stroke-width="1"/>`;
if(side)return `<svg viewBox="0 0 100 85" xmlns="http://www.w3.org/2000/svg">${shadow}<path d="${bodyPath}" fill="${col}" stroke="#0a0b0d" stroke-width="1.4"/>${cabin}${m3f}${bumper}${wheels}${badges}</svg>`;
let front=rear?`<path d="M20 58 Q24 43 39 36 Q50 32 63 36 Q77 43 81 58 L77 69 L24 69 Z" fill="${col}" stroke="#090a0c" stroke-width="1.5"/><path d="M32 47 Q50 39 69 47 L66 56 L34 56 Z" fill="#17212a"/><rect x="27" y="59" width="46" height="6" rx="2" fill="#1a1e22"/><rect x="30" y="61" width="9" height="2" fill="#a22"/><rect x="61" y="61" width="9" height="2" fill="#a22"/>`:`<path d="M19 62 Q21 47 34 37 Q45 28 61 31 Q76 35 84 48 L89 61 L84 69 L24 69 Z" fill="${col}" stroke="#090a0c" stroke-width="1.5"/><path d="M35 43 Q47 32 60 34 Q70 36 77 44 L72 51 L40 50 Z" fill="#17212a"/><path d="M47 34 L44 50 M63 35 L65 51" stroke="#0a0b0d" stroke-width="1"/><rect x="19" y="59" width="16" height="6" rx="2" fill="#e7e7d0"/><rect x="76" y="58" width="11" height="6" rx="2" fill="#e7e7d0"/>`;
return `<svg viewBox="0 0 100 85" xmlns="http://www.w3.org/2000/svg">${shadow}${front}${m3f}${rear? '': '<g transform="translate(26 62) scale(.10)">'+wheelSVG(wheel,false).replace('<svg','<g').replace('</svg>','</g>')+'</g><g transform="translate(67 62) scale(.10)">'+wheelSVG(wheel,false).replace('<svg','<g').replace('</svg>','</g>')+'</g>'}</g></svg>`
}
function updatePreview(){document.getElementById('car').innerHTML=carSVG();document.getElementById('caption').textContent=`${selected('model')[0]} · ${selected('body')[0]} · ${selected('engine')[0]} · ${selected('color')[0]}`;renderSummary()}
function renderSummary(){const s=document.getElementById('sec-summary');if(!s)return;s.innerHTML=`<div class="eyebrow">E30Heaven</div><div class="title">Your build</div><div class="sub">Everything below is saved in this configurator.</div><div class="summary">${['model','body','engine','color','wheels','interior'].map(k=>`<div class="summary-row"><span>${k.toUpperCase()}</span><b>${esc(selected(k)[0])}</b></div>`).join('')}</div><div class="price">€${money().toLocaleString()}</div><div class="specs"><div class="spec"><b>${selected('engine')[2]}</b><span>POWER</span></div><div class="spec"><b>${state.body===3?'2.0':'RWD / iX'}</b><span>DRIVETRAIN</span></div><div class="spec"><b>${selected('wheels')[0]}</b><span>WHEELS</span></div></div><div class="nav"><button class="btn" onclick="go(0)">EDIT BUILD</button><button class="btn primary" onclick="shareBuild()">SHARE BUILD</button></div>`}
function payload(){return {...state,view:state.view}}
function saveBuild(){localStorage.setItem('e30heaven-build-v4',JSON.stringify(payload()));toast('Build saved')}
function loadBuild(){const raw=localStorage.getItem('e30heaven-build-v4');if(!raw){toast('No saved build found');return}try{state={...state,...JSON.parse(raw)};renderAll();setView(state.view||'three');toast('Build loaded')}catch(e){toast('Saved build is invalid')}}
function shareBuild(){const b=btoa(unescape(encodeURIComponent(JSON.stringify(payload()))));const url=location.href.split('#')[0]+'#build='+b;navigator.clipboard?.writeText(url);history.replaceState(null,'',url);toast('Share link copied')}
function loadFromHash(){if(!location.hash.startsWith('#build='))return;try{const raw=decodeURIComponent(escape(atob(location.hash.slice(7))));state={...state,...JSON.parse(raw)};renderAll();setView(state.view||'three');toast('Shared build loaded')}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove('show'),1600)}
init();
</script></body></html>
